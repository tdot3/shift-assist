<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>スタッフログイン</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: #f5f6f8;
        }

        .login-wrapper {
            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        .login-card {
            width: 100%;

            max-width: 420px;

            border: 0;

            border-radius: 16px;

            box-shadow:
                0 4px 20px
                rgba(0,0,0,0.08);
        }

    </style>

</head>


<body>


<div class="login-wrapper px-3">


    <div class="card login-card">


        <div class="card-body p-4 p-md-5">


            <div class="text-center mb-4">


                <h3 class="fw-bold">

                    スタッフログイン

                </h3>


                <div class="text-muted">

                    自分のシフトを確認できます

                </div>


            </div>


            {% with messages = get_flashed_messages() %}

                {% if messages %}

                    {% for message in messages %}

                        <div class="alert alert-danger">

                            {{ message }}

                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <form method="POST">


                <div class="mb-3">


                    <label class="form-label">

                        スタッフID

                    </label>


                    <input
                        type="number"
                        name="staff_id"
                        class="form-control form-control-lg"
                        placeholder="例：1"
                        required>


                </div>


                <div class="mb-4">


                    <label class="form-label">

                        PIN

                    </label>


                    <input
                        type="password"
                        name="pin"
                        class="form-control form-control-lg"
                        inputmode="numeric"
                        required>


                </div>


                <button
                    type="submit"
                    class="btn btn-primary btn-lg w-100">

                    ログイン

                </button>


            </form>


            <div class="text-center mt-4">


                <a
                    href="/login"
                    class="text-decoration-none">

                    管理者ログインへ戻る

                </a>


            </div>


        </div>


    </div>


</div>


</body>

</html>
